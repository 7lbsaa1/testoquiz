<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة الامتحانات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --accent: #8b5cf6;
      --card-bg: rgba(15, 23, 42, 0.6);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 1250px; margin: 0 auto; }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
      padding: 1rem 1.5rem; border-radius: 16px; margin-bottom: 2rem;
    }
    .admin-title { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 800; color: var(--primary); }

    .theme-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); color: var(--text-main);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; background: rgba(59, 130, 246, 0.15); color: var(--primary); }
    .stat-info h4 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-info span { font-size: 1.5rem; font-weight: 800; }

    .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 1rem; }
    .search-box { position: relative; flex: 1; }
    .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-input { width: 100%; padding: 10px 40px 10px 14px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--text-main); outline: none; }

    .table-container { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--glass-border); white-space: nowrap; }
    th { background: rgba(0, 0, 0, 0.2); color: var(--text-muted); font-weight: 700; font-size: 0.9rem; }
    .table-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

    .quiz-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.08);
      font-size: 0.82rem; margin: 2px; cursor: pointer; border: 1px solid var(--glass-border);
    }
    .quiz-pill:hover { background: rgba(59, 130, 246, 0.2); border-color: var(--primary); }

    .btn-danger { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .btn-danger:hover { background: #dc2626; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid var(--glass-border); border-radius: 16px; width: 100%; max-width: 750px; max-height: 90vh; display: flex; flex-direction: column; }
    .modal-header { padding: 1.25rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 1.25rem; border-top: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
    .glass-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 12px; }
    .form-control { width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); margin-top: 4px; }

    #toastContainer { position: fixed; bottom: 20px; left: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 10px; border-right: 4px solid var(--success); display: flex; align-items: center; gap: 10px; }
    .toast.error { border-right-color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <header class="admin-header">
      <div class="admin-title">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>لوحة التحكم - سجل الامتحانات</span>
      </div>
      <button class="theme-btn" id="themeToggleBtn">
        <i class="fa-solid fa-moon"></i>
        <span>الوضع</span>
      </button>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
        <div class="stat-info">
          <h4>إجمالي المستخدمين</h4>
          <span id="statTotalUsers">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="color: var(--success); background: rgba(16, 185, 129, 0.15);"><i class="fa-solid fa-circle-check"></i></div>
        <div class="stat-info">
          <h4>المكتملين</h4>
          <span id="statSubmitted">0</span>
        </div>
      </div>
    </section>

    <div class="controls-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="adminSearchInput" class="search-input" placeholder="ابحث باسم المستخدم أو رقم الهاتف...">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>الصورة</th>
            <th>الاسم</th>
            <th>الهاتف / واتساب</th>
            <th>سجل الامتحانات (عرض التفاصيل)</th>
            <th>إجراءات الإدارة</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" style="text-align: center;">جاري جلب البيانات...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal معاينة نتائج الامتحان -->
  <div class="modal-overlay" id="gradingModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalUserNameTitle">تفاصيل الامتحان</h3>
        <button id="closeGradingModalBtn" style="background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="modal-body">
        <div id="modalExamContent"></div>

        <div class="glass-card" style="padding: 1rem; margin-top: 1rem;">
          <label style="font-weight: 700; color: var(--primary);">رسالة مخصصة للعميل:</label>
          <input type="text" id="adminMessageInput" class="form-control" placeholder="أداء رائع يا بطل!">
        </div>
      </div>

      <div class="modal-footer">
        <button id="togglePublishResultBtn" class="btn-primary" style="background: var(--accent);">
          <i class="fa-solid fa-eye"></i> إظهار/إخفاء النتيجة
        </button>
        <button id="saveGradingBtn" class="btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>
  <script type="module" src="./admin.js"></script>
</body>
</html>
